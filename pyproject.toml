[project]
name = "platewright"
version = "0.1.0"
description = "Platewright: repeatable, reliable print plates, as an app in Bambuddy's sidebar"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "jinja2>=3.1,<4",
    "httpx>=0.27,<1",
    "itsdangerous>=2.2,<3",
    "python-multipart>=0.0.18",
    "brother-ql-next>=0.12,<1",
    "pillow>=11",
    "segno>=1.6,<2",
]

[project.scripts]
platewright = "platewright.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platewright"]

[tool.pytest.ini_options]
testpaths = ["tests"]
