{% extends "base.html" %}
{% block title %}{{ title }} · Platewright{% endblock %}
{% block content %}
<section class="card">
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  {% if back %}<p><a class="btn" href="/" data-back>Back</a></p>{% endif %}
  {% if retry %}<p><a class="btn btn-accent" href="/auth/login">Sign in with Bambuddy</a></p>{% endif %}
</section>
{% endblock %}
