<!doctype html>
<html lang="en" class="bg-neutral style-classic accent-green"
      data-bambuddy-origin="{{ config.bambuddy_origin }}"
      data-bambuddy-url="{{ config.bambuddy_url }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "responseHandling": [{"code": "204", "swap": false}, {"code": "[23]..", "swap": true}, {"code": "[45]..", "swap": true, "error": true}]}'>
  <title>{% block title %}Platewright{% endblock %}</title>
  <link rel="stylesheet" href="{{ static('app.css') }}">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ static('icon-32.png') }}">
  <link rel="apple-touch-icon" href="{{ static('icon-180.png') }}">
  <meta name="apple-mobile-web-app-title" content="Platewright">
  <meta name="theme-color" content="#00ae42">
  <script src="{{ static('htmx.min.js') }}" defer></script>
  <script src="{{ static('app.js') }}" defer></script>
</head>
<body>
  {% if user %}
  <nav class="tabs" aria-label="Platewright">
    <a href="/" {% if nav == "today" %}aria-current="page"{% endif %}>Today</a>
    <a href="/demand" {% if nav == "demand" %}aria-current="page"{% endif %}>Demand</a>
    <a href="/plates" {% if nav == "plates" %}aria-current="page"{% endif %}>Plates</a>
    <a href="/models" {% if nav == "models" %}aria-current="page"{% endif %}>Models</a>
    <a href="/stock" {% if nav == "stock" %}aria-current="page"{% endif %}>Stock</a>
    <a href="/filament" {% if nav == "filament" %}aria-current="page"{% endif %}>Filament</a>
    {% if role == "admin" %}<a href="/settings" {% if nav == "settings" %}aria-current="page"{% endif %}>Settings</a>{% endif %}
  </nav>
  {% endif %}
  <main class="wrap">
    {% if notice %}<p class="notice-bar" role="status">{{ notice }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
  {% if user %}
  <footer class="wrap foot">
    <span>{{ user.username }} · {{ role }}</span>
    <form method="post" action="/auth/logout"><button class="link" type="submit">Sign out</button></form>
  </footer>
  {% endif %}
</body>
</html>
